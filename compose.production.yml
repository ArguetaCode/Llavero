services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sodi-key-web:${IMAGE_TAG:-latest}
    container_name: sodi_key_web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - proxy

networks:
  proxy:
    name: sodi_proxy
    external: true
