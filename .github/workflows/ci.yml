name: CI y despliegue de Sodi Key

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sodi-key-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reject-secrets:
    name: Rechazar secretos commiteados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Buscar archivos sensibles versionados
        shell: bash
        run: |
          set -euo pipefail
          blocked="$(git ls-files | grep -Ei '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' || true)"
          test -z "$blocked" || { echo "Archivos sensibles versionados:"; echo "$blocked"; exit 1; }

  frontend:
    name: Validar frontend
    needs: reject-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build:local

  backend:
    name: Validar backend
    needs: reject-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Tests de backend
        working-directory: backend
        run: ./mvnw --batch-mode test

  validate-compose:
    name: Validar compose de producción
    needs: reject-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: docker compose -f compose.production.yml config --quiet

  build-image:
    name: Construir imagen Docker de producción
    needs: [frontend, validate-compose]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build (validación previa a producción)
        run: docker build -t "sodi-key-web:ci-${{ github.sha }}" .

  deploy:
    name: Desplegar en el VPS
    needs: [frontend, backend, validate-compose, build-image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Preparar SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SODI_KEY_VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SODI_KEY_VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ejecutar script de despliegue
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.SODI_KEY_VPS_USER }}@${{ secrets.SODI_KEY_VPS_HOST }}" \
            "/opt/sodi-platform/infra/scripts/deploy-sodi-key.sh ${{ github.sha }}"

      - name: Verificar salud desde la red de Caddy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.SODI_KEY_VPS_USER }}@${{ secrets.SODI_KEY_VPS_HOST }}" \
            "docker exec sodi_caddy wget -qO- http://sodi_key_web/health"

      - name: Verificar dominio público por HTTPS
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://sodi-key.sodiconsultores.com/health)"
          if [ "$status" != "200" ]; then
            echo "El dominio público respondió $status en lugar de 200"
            exit 1
          fi
          echo "Dominio público OK ($status)"
