spring:
  datasource:
    url: jdbc:h2:mem:llavero_seguro_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  security:
    jwt-secret: test-secret-at-least-32-bytes-long
    jwt-expiration-minutes: 120
  cors:
    allowed-origins: http://localhost:5173
  vault:
    max-encrypted-payload-bytes: 1048576
