spring:
  application:
    name: llavero-seguro-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false

server:
  error:
    include-message: never
    include-stacktrace: never

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-at-least-32-bytes}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*:5173,http://10.*:5173,http://172.16.*:5173,http://172.17.*:5173,http://172.18.*:5173,http://172.19.*:5173,http://172.20.*:5173,http://172.21.*:5173,http://172.22.*:5173,http://172.23.*:5173,http://172.24.*:5173,http://172.25.*:5173,http://172.26.*:5173,http://172.27.*:5173,http://172.28.*:5173,http://172.29.*:5173,http://172.30.*:5173,http://172.31.*:5173}
  vault:
    max-encrypted-payload-bytes: ${MAX_ENCRYPTED_PAYLOAD_BYTES:1048576}
