services:
  postgres:
    image: postgres:16-alpine
    container_name: llavero-seguro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: llavero_seguro
      POSTGRES_USER: llavero_dev
      POSTGRES_PASSWORD: llavero_dev_password
    ports:
      - "5432:5432"
    volumes:
      - llavero_seguro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llavero_dev -d llavero_seguro"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llavero-seguro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/llavero_seguro
      DB_USERNAME: llavero_dev
      DB_PASSWORD: llavero_dev_password
      JWT_SECRET: dev-only-change-this-secret-at-least-32-bytes
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-10080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://192.168.*:5173,http://10.*:5173,http://172.16.*:5173,http://172.17.*:5173,http://172.18.*:5173,http://172.19.*:5173,http://172.20.*:5173,http://172.21.*:5173,http://172.22.*:5173,http://172.23.*:5173,http://172.24.*:5173,http://172.25.*:5173,http://172.26.*:5173,http://172.27.*:5173,http://172.28.*:5173,http://172.29.*:5173,http://172.30.*:5173,http://172.31.*:5173,https://*.trycloudflare.com}
    ports:
      - "8080:8080"

volumes:
  llavero_seguro_postgres:
